general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.2
    outer_color = rgb(89b4fa)
    inner_color = rgb(1e1e2e)
    font_color = rgb(cdd6f4)
    fade_on_empty = false
    placeholder_text = Пароль
    position = 0, -20
    halign = center
    valign = center
    fail_text = $FAIL <b>($ATTEMPTS)</b>
    fail_color = rgb(f38ba8)
    check_color = rgb(f9e2af)
    capslock_color = rgb(fab387)
}

label {
    monitor =
    text = $TIME
    font_size = 72
    color = rgb(cdd6f4)
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    font_size = 18
    color = rgb(cdd6f4)
    position = 0, -90
    halign = center
    valign = center
}
