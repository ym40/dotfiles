add_newline = true

format = """
$username$hostname$directory$git_branch$git_status$cmd_duration
$character"""

[directory]
truncation_length = 4
truncation_symbol = "…/"
style = "bold blue"
read_only = " 🔒"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[cmd_duration]
min_time = 2000
format = "[took $duration](yellow) "

[username]
show_always = true
style_user = "bold cyan"
format = "[$user]($style)@"

[hostname]
ssh_only = false
format = "[$hostname]($style) "
style = "bold cyan"
